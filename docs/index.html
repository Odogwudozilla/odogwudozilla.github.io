<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
    <meta name="description" content="Senior Software Engineer specializing in enterprise insurance technology solutions. 6+ years Java development experience with expertise in microservices, Spring Boot, and financial services domain knowledge."/>
    <meta name="author" content="Chidozie Nnachor"/>
    <meta name="keywords" content="software engineer, java developer, enterprise software, insurance technology, microservices, spring boot, fintech"/>
    <title>Chidozie Nnachor - Senior Software Engineer | Enterprise Insurance Technology</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
    <link rel="icon" type="image/x-icon" href="assets/img/favicon.png"/>
    <!-- Font Awesome icons -->
    <script src="https://use.fontawesome.com/releases/v6.4.0/js/all.js" crossorigin="anonymous"></script>
    <!-- Google fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Saira+Extra+Condensed:wght@500;700&display=swap" rel="stylesheet"/>
    <!-- Core theme CSS - Modular approach -->
    <link href="css/base.css" rel="stylesheet"/>
    <link href="css/navigation.css" rel="stylesheet"/>
    <link href="css/sections.css" rel="stylesheet"/>
    <link href="css/components.css" rel="stylesheet"/>
    <link href="css/responsive.css" rel="stylesheet"/>
</head>

<body>
    <!-- Navigation (loaded from partial) -->
    <div id="navigation-container"></div>

    <!-- Page Content -->
    <main>
        <!-- Hero Section (loaded from partial) -->
        <div id="hero-container"></div>

        <!-- Experience Section (loaded from partial) -->
        <div id="experience-container"></div>

        <!-- Skills Section (loaded from partial) -->
        <div id="skills-container"></div>

        <!-- Portfolio Section (loaded from partial) -->
        <div id="portfolio-container"></div>

        <!-- Education Section (loaded from partial) -->
        <div id="education-container"></div>

        <!-- Contact Section (loaded from partial) -->
        <div id="contact-container"></div>
    </main>


    <!-- Core theme JS -->
    <script src="js/scripts.js"></script>
    <script src="js/components-loader.js"></script>

    <!-- Custom animations script -->
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        // Animate skill bars on scroll
        const skillBars = document.querySelectorAll('.skill-progress-bar');
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.style.animationDelay = '0.5s';
                    entry.target.classList.add('animate');
                }
            });
        });

        skillBars.forEach(bar => observer.observe(bar));

        // Add smooth hover effects
        const cards = document.querySelectorAll('.portfolio-card, .contact-item');
        cards.forEach(card => {
            card.addEventListener('mouseenter', function() {
                this.style.transform = 'translateY(-8px)';
            });
            card.addEventListener('mouseleave', function() {
                this.style.transform = 'translateY(0)';
            });
        });
    });
    </script>

</body>

</html>
