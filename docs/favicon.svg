<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <!-- Subtle shadow for depth -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Clean white background -->
  <!-- Removed - background now transparent -->

  <!-- Bold CN Monogram - centered with equal padding -->
  <text x="128" y="165" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="180" font-weight="900" text-anchor="middle" fill="#000000" filter="url(#shadow)">CN</text>

  <!-- Gold accent underline - centered -->
  <rect x="50" y="175" width="156" height="9" fill="#d4a574" rx="4.5"/>
</svg>



