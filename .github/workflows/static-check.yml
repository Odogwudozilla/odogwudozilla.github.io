name: Static checks

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: static-verification-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  static-verification:
    name: static-verification
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the proposed merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select the pinned Node runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Verify Node and bundled npm versions
        shell: bash
        run: |
          node --version
          npm --version
          node <<'NODE'
          const fs = require('node:fs');
          const expected = fs.readFileSync('.node-version', 'utf8').trim();
          if (process.version !== 'v' + expected) {
            throw new Error('Node version does not match .node-version');
          }
          NODE
          test "$(npm --version)" = "11.19.1"

      - name: Check committed HTML and structural invariants
        run: npm run check:static
